server {
    listen 3000;
    listen [::]:3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /api { return 404; }
    location /api/ { return 404; }
    location = /admin { return 404; }
    location /admin/ { return 404; }
    location = /tracker.js { return 404; }
    # Browser icons are tiny: revalidate on every visit to avoid stale 404/icon cache.
    location = /favicon.ico { try_files $uri =404; add_header Cache-Control "no-cache" always; }
    location = /favicon-16.png { try_files $uri =404; add_header Cache-Control "no-cache" always; }
    location = /favicon-32.png { try_files $uri =404; add_header Cache-Control "no-cache" always; }
    location /assets/ { try_files $uri =404; access_log off; expires 1y; }
    location /models/ { try_files $uri =404; access_log off; expires 7d; }
    location /images/ { try_files $uri =404; access_log off; expires 7d; }
    location = /index.html { add_header Cache-Control "no-cache" always; }
    location = / { try_files /index.html =404; }
    location / { try_files $uri $uri/ =404; }
}
